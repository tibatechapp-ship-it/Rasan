name: rasan_mobile
description: Rasan — private chat
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  socket_io_client: ^2.0.3+1
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  image_picker: ^1.2.4
  # Push notifications (FCM) — إشعارات آمنة بلا محتوى الرسائل (E2EE)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^19.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
