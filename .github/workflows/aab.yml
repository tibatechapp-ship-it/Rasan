name: aab

# أسبوع 1 من خارطة المنتَجة: حزمة AAB قابلة للرفع على Google Play
# تُبنى تلقائياً عند كل tag (v*) — الدليل القابل للتحقق: artifact جاهز
# في صفحة الـrun نفسها.
#
# الأمانة الكاملة: التوقيع الحالي بمفتاح debug (كما في build.gradle.kts)
# حتى يُوفَّر keystore التوقيع الحقيقي كـsecret مشفر — بناء الـrelease
# يعمل، والرفع على قناة الإنتاج يتطلب استبدال التوقيع أولاً (أسبوع 2).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      # Gradle/Kotlin في المشروع موجه على JVM 17 صراحة (build.gradle.kts)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ملاحظة أمنية للمستودع: لا flutter create . إطلاقاً — مجلدات
      # android/ مرفوعة إلى Git وتخصيصاتها يدوية.

      - name: Pub get
        run: flutter pub get

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Collect store listing check
        run: |
          test -f docs/store/listing-ar.md || (echo "docs/store/listing-ar.md missing" && exit 1)
          test -f docs/store/listing-en.md || (echo "docs/store/listing-en.md missing" && exit 1)
          echo "store listing text assets present"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: rasan-mobile-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
